name: daily-pipeline
# Seed Torvik files from raw-cache -> regression-test -> rate -> commit data/<season>/.
# Torvik returns 403 to Actions IPs, so a collector on an accepted network pushes the
# three Torvik files to the raw-cache branch first (docs/torvik-fetch.md).
on:
  workflow_dispatch:
    inputs:
      commit_route:
        description: "auto = direct push, PR if refused; pr = always PR"
        type: choice
        options: [auto, pr]
        default: auto
  schedule:
    - cron: "17 11 * * *"   # 6:17 AM ET (standard time), after West Coast games finalize
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Seed Torvik files from collector (raw-cache branch)
        run: python scripts/seed_raw_cache.py
      - name: Run pipeline (current season)
        run: python scripts/run_pipeline.py
      - name: Commit data
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_ROUTE: ${{ inputs.commit_route || 'auto' }}
        run: .github/scripts/commit_data.sh
